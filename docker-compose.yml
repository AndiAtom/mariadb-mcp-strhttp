version: '3.8'

services:
  mariadb-mcp-server:
    build: .
    container_name: mariadb-mcp-server
    ports:
      - "8000:8000"
    environment:
      # Datenbank-Konfiguration
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_DATABASE=testdb
      - DB_TIMEOUT=30
      
      # Server-Konfiguration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=info
      
      # API Token Authentifizierung (optional)
      # Ein einzelner Token:
      # - API_TOKEN=your-secure-token
      # Mehrere Tokens (komma-separiert):
      # - API_TOKENS=token1,token2,token3
      # Token aus Datei laden:
      # - API_TOKEN_FILE=/app/tokens.json
      # Authentifizierung deaktivieren:
      # - DISABLE_API_AUTH=true
      # Benutzerdefinierte Header/Parameter Namen:
      # - API_HEADER_NAME=X-API-Key
      # - API_QUERY_PARAM=token
      
      # Rate Limiting (optional)
      # - RATE_LIMITING_ENABLED=true
      # - RATE_LIMIT_REQUESTS_PER_MINUTE=100
      # - RATE_LIMIT_BURST_REQUESTS=10
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      # Token-Datei mounten (optional):
      # - ./tokens.json:/app/tokens.json:ro
    networks:
      - mcp-network

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb-data:

networks:
  mcp-network:
    driver: bridge
